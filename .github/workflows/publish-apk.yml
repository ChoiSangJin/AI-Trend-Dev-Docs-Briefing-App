name: Publish verified Android APK
on:
  push:
    branches: ['release-artifacts/v1.0.7']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify the signed APK payload and source
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 56d0120dd715dbef6d3662e0668fc63660971fbc origin/main
          python3 tool/verify_apk.py release-assets/v1.0.7/ai-morning-briefing-arm64.apk
          cd release-assets/v1.0.7
          sha256sum -c SHA256SUMS.txt
      - name: Publish v1.0.7 from the merged source commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.7 \
            --repo "$GITHUB_REPOSITORY" \
            --target 56d0120dd715dbef6d3662e0668fc63660971fbc \
            --title 'AI 모닝 브리핑 v1.0.7' \
            --notes-file release-assets/v1.0.7/RELEASE_NOTES.md \
            release-assets/v1.0.7/ai-morning-briefing-arm64.apk \
            release-assets/v1.0.7/SHA256SUMS.txt
