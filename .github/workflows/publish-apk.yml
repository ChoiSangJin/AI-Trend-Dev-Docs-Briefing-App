name: Publish verified Android APK
on:
  push:
    branches: ['release-artifacts/v1.0.1']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify the signed APK payload and source
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 4c2863105ff64317024e4e0e4ff4b5290a7de24b origin/main
          python3 tool/verify_apk.py release-assets/v1.0.1/ai-morning-briefing-arm64.apk
          cd release-assets/v1.0.1
          sha256sum -c SHA256SUMS.txt
      - name: Publish v1.0.1 from the merged source commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.1 \
            --repo "$GITHUB_REPOSITORY" \
            --target 4c2863105ff64317024e4e0e4ff4b5290a7de24b \
            --title 'AI 모닝 브리핑 v1.0.1' \
            --notes-file release-assets/v1.0.1/RELEASE_NOTES.md \
            release-assets/v1.0.1/ai-morning-briefing-arm64.apk \
            release-assets/v1.0.1/SHA256SUMS.txt
