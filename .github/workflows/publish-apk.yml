name: Publish verified Android APK
on:
  push:
    branches: ['release-artifacts/v1.0.5']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify the signed APK payload and source
        run: |
          set -euo pipefail
          git merge-base --is-ancestor b0e5949882b490fba7886bc47d9979d7479efc1c origin/main
          python3 tool/verify_apk.py release-assets/v1.0.5/ai-morning-briefing-arm64.apk
          cd release-assets/v1.0.5
          sha256sum -c SHA256SUMS.txt
      - name: Publish v1.0.5 from the merged source commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.5 \
            --repo "$GITHUB_REPOSITORY" \
            --target b0e5949882b490fba7886bc47d9979d7479efc1c \
            --title 'AI 모닝 브리핑 v1.0.5' \
            --notes-file release-assets/v1.0.5/RELEASE_NOTES.md \
            release-assets/v1.0.5/ai-morning-briefing-arm64.apk \
            release-assets/v1.0.5/SHA256SUMS.txt
