name: Publish signed Android release
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Prepare version and previous public APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version: \([^+]*\)+.*/\1/p' pubspec.yaml)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo 'Release tag already exists'; exit 1
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/previous-apk"
          gh release download --repo "$GITHUB_REPOSITORY" --pattern ai-morning-briefing-arm64.apk --dir "$RUNNER_TEMP/previous-apk"
      - name: Restore signing identity from GitHub Secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os, subprocess, hashlib, re
          from pathlib import Path
          names = ['ANDROID_KEYSTORE_BASE64', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD']
          if any(not os.environ.get(name) for name in names):
              raise SystemExit('Required Android signing secrets are missing')
          key = Path(os.environ['RUNNER_TEMP']) / 'android-release.keystore'
          key.write_bytes(base64.b64decode(''.join(os.environ[names[0]].split()), validate=True))
          key.chmod(0o600)
          def fail(message):
              print('::error title=Signing Secrets::' + message)
              raise SystemExit(1)
          command = ['keytool', '-list', '-keystore', str(key), '-storepass:env', 'ANDROID_KEYSTORE_PASSWORD']
          result = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
          if result.returncode:
              fail('ANDROID_KEYSTORE_PASSWORD cannot unlock ANDROID_KEYSTORE_BASE64; update the matching GitHub Secrets')
          result = subprocess.run(command + ['-alias', os.environ['ANDROID_KEY_ALIAS']], stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
          if result.returncode:
              fail('ANDROID_KEY_ALIAS was not found in the registered keystore')
          public_cert = subprocess.run(['keytool', '-exportcert', '-keystore', str(key), '-storepass:env', 'ANDROID_KEYSTORE_PASSWORD', '-alias', os.environ['ANDROID_KEY_ALIAS']], stdout=subprocess.PIPE, stderr=subprocess.PIPE)
          if public_cert.returncode:
              fail('Unable to export the signing public certificate')
          signer = str(Path(os.environ['ANDROID_HOME']) / 'build-tools/36.0.0/apksigner')
          previous = str(Path(os.environ['RUNNER_TEMP']) / 'previous-apk/ai-morning-briefing-arm64.apk')
          output = subprocess.check_output([signer, 'verify', '--print-certs', previous], text=True)
          previous_certs = re.findall(r'^Signer #\d+ certificate SHA-256 digest: (.+)$', output, re.M)
          if previous_certs != [hashlib.sha256(public_cert.stdout).hexdigest()]:
              fail('ANDROID_KEYSTORE_BASE64 certificate differs from the previous public APK; restore the original signing keystore')
          print('GitHub signing password, alias and previous release certificate verified')
          def escape(value):
              replacements = {'\\': '\\\\', '\n': '\\n', '\r': '\\r', '\t': '\\t', ' ': '\\ ', '=': '\\=', ':': '\\:', '#': '\\#', '!': '\\!'}
              return ''.join(replacements.get(c, c) if ord(c) < 128 else ''.join('\\u%04x' % int.from_bytes(c.encode('utf-16-be')[i:i+2], 'big') for i in range(0, len(c.encode('utf-16-be')), 2)) for c in value)
          values = {'storeFile': str(key), 'storePassword': os.environ[names[1]], 'keyAlias': os.environ[names[2]], 'keyPassword': os.environ[names[3]]}
          properties = Path('android/key.properties')
          properties.write_text(''.join(f'{k}={escape(v)}\n' for k, v in values.items()), encoding='ascii')
          properties.chmod(0o600)
          PY
      - name: Build and test signed arm64 APK
        run: |
          set +e
          bash tool/build_release.sh > "$RUNNER_TEMP/release-build.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/release-build.log"
          if [ "$result" -ne 0 ]; then
            python3 - <<'PYDIAG'
          import os
          from pathlib import Path
          lines = (Path(os.environ['RUNNER_TEMP']) / 'release-build.log').read_text(errors='replace').splitlines()
          diagnostic = '\n'.join(lines[-45:])
          diagnostic = diagnostic.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Release build failure::' + diagnostic)
          PYDIAG
          fi
          exit "$result"
      - name: Verify update compatibility and release metadata
        run: |
          set -euo pipefail
          export APK_SIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          python3 - <<'PY'
          import os, subprocess, re
          from pathlib import Path
          apk = 'build/release/ai-morning-briefing-arm64.apk'
          previous = str(Path(os.environ['RUNNER_TEMP']) / 'previous-apk/ai-morning-briefing-arm64.apk')
          def cert(path):
              output = subprocess.check_output([os.environ['APK_SIGNER'], 'verify', '--print-certs', path], text=True)
              return re.findall(r'^Signer #\d+ certificate SHA-256 digest: (.+)$', output, re.M)
          def fail(message):
              print('::error title=APK compatibility::' + message)
              raise SystemExit(1)
          current, old = cert(apk), cert(previous)
          if not current or current != old:
              fail('Signing certificate does not match the previous public release')
          analyzer = str(Path(os.environ['ANDROID_HOME']) / 'cmdline-tools/latest/bin/apkanalyzer')
          def manifest(path, field):
              return subprocess.check_output([analyzer, 'manifest', field, path], text=True).strip()
          if manifest(apk, 'version-name') != os.environ['RELEASE_TAG'][1:]:
              fail('APK version mismatch')
          if manifest(apk, 'debuggable') != 'false':
              fail('Debuggable APK cannot be published')
          if manifest(apk, 'application-id') != manifest(previous, 'application-id'):
              fail('Application ID changed')
          if int(manifest(apk, 'version-code')) <= int(manifest(previous, 'version-code')):
              fail('Version code must increase')
          print('Verified release version, application ID and signing compatibility')
          PY
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 build/release/ai-morning-briefing-arm64.apk
          cd build/release
          sha256sum -c SHA256SUMS.txt
      - name: Publish verified APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" --title "AI 모닝 브리핑 $RELEASE_TAG" \
            --notes-file RELEASE_NOTES.md \
            build/release/ai-morning-briefing-arm64.apk build/release/SHA256SUMS.txt
      - name: Remove signing files
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/android-release.keystore"
